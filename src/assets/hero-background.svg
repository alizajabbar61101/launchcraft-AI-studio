<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="baseWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#FCFDFF" />
      <stop offset="100%" stop-color="#F3F6FF" />
    </linearGradient>

    <radialGradient id="skyBlob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BFE1FF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#BFE1FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanBlob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9F7F5" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#C9F7F5" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="violetBlob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E3D6FF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#E3D6FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleBlob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAD9FF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#EAD9FF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6E7BFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#6E7BFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6E7BFF" stop-opacity="0" />
    </linearGradient>

    <filter id="softBlurLg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <filter id="softBlurMd" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="softBlurSm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Base wash -->
  <rect width="1920" height="1080" fill="url(#baseWash)" />

  <!-- Large ambient color blobs, concentrated toward the right / edges -->
  <circle cx="1620" cy="160" r="360" fill="url(#skyBlob)" filter="url(#softBlurLg)" />
  <circle cx="1780" cy="640" r="420" fill="url(#violetBlob)" filter="url(#softBlurLg)" />
  <circle cx="1500" cy="960" r="320" fill="url(#cyanBlob)" filter="url(#softBlurLg)" />
  <circle cx="120" cy="980" r="300" fill="url(#purpleBlob)" filter="url(#softBlurLg)" />
  <circle cx="60" cy="80" r="220" fill="url(#skyBlob)" filter="url(#softBlurLg)" />

  <!-- ============ TOP RIGHT CLUSTER ============ -->
  <g opacity="0.5" filter="url(#softBlurSm)">
    <!-- neural network nodes -->
    <g stroke="#6E7BFF" stroke-width="1.4" fill="none" opacity="0.6">
      <line x1="1560" y1="90" x2="1660" y2="150" />
      <line x1="1660" y1="150" x2="1760" y2="100" />
      <line x1="1660" y1="150" x2="1720" y2="230" />
      <line x1="1560" y1="90" x2="1620" y2="30" />
      <line x1="1720" y1="230" x2="1800" y2="270" />
      <line x1="1760" y1="100" x2="1840" y2="150" />
    </g>
    <g fill="#7C8CFF" opacity="0.55">
      <circle cx="1560" cy="90" r="5" />
      <circle cx="1660" cy="150" r="6.5" />
      <circle cx="1760" cy="100" r="5" />
      <circle cx="1620" cy="30" r="4" />
      <circle cx="1720" cy="230" r="5" />
      <circle cx="1800" cy="270" r="4.5" />
      <circle cx="1840" cy="150" r="4" />
    </g>
  </g>

  <!-- minimal robot face outline, top right -->
  <g transform="translate(1690,300)" opacity="0.35" stroke="#7B6BE0" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="20" width="90" height="72" rx="18" />
    <circle cx="27" cy="56" r="7" fill="#7B6BE0" stroke="none" opacity="0.8" />
    <circle cx="63" cy="56" r="7" fill="#7B6BE0" stroke="none" opacity="0.8" />
    <path d="M 27 78 Q 45 88 63 78" />
    <line x1="45" y1="20" x2="45" y2="2" />
    <circle cx="45" cy="0" r="5" fill="none" />
  </g>

  <!-- tiny circuit pattern, top right edge -->
  <g stroke="#6E7BFF" stroke-width="1.6" fill="none" opacity="0.3" stroke-linecap="round">
    <path d="M1880 40 h-40 v30 h-25 v25" />
    <circle cx="1880" cy="40" r="4" fill="#6E7BFF" stroke="none" />
    <circle cx="1815" cy="95" r="4" fill="#6E7BFF" stroke="none" />
    <path d="M1900 130 h-30 v40 h-50" />
    <circle cx="1900" cy="130" r="3.5" fill="#6E7BFF" stroke="none" />
    <circle cx="1820" cy="170" r="3.5" fill="#6E7BFF" stroke="none" />
  </g>

  <!-- ============ RIGHT MID-SIDE CLUSTER ============ -->

  <!-- AI chip symbol -->
  <g transform="translate(1810,470)" opacity="0.3" stroke="#5D8CFF" stroke-width="2" fill="none" stroke-linecap="round">
    <rect x="10" y="10" width="60" height="60" rx="8" />
    <rect x="26" y="26" width="28" height="28" rx="4" />
    <line x1="20" y1="0" x2="20" y2="10" />
    <line x1="40" y1="0" x2="40" y2="10" />
    <line x1="60" y1="0" x2="60" y2="10" />
    <line x1="20" y1="70" x2="20" y2="80" />
    <line x1="40" y1="70" x2="40" y2="80" />
    <line x1="60" y1="70" x2="60" y2="80" />
    <line x1="0" y1="20" x2="10" y2="20" />
    <line x1="0" y1="40" x2="10" y2="40" />
    <line x1="0" y1="60" x2="10" y2="60" />
    <line x1="70" y1="20" x2="80" y2="20" />
    <line x1="70" y1="40" x2="80" y2="40" />
    <line x1="70" y1="60" x2="80" y2="60" />
  </g>

  <!-- small AI assistant symbol (chat bubble with sparkle) -->
  <g transform="translate(1660,560)" opacity="0.32" stroke="#8A6DF0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 20 a20 20 0 0 1 20 -20 h40 a20 20 0 0 1 20 20 v18 a20 20 0 0 1 -20 20 h-30 l-14 14 v-14 h4 a20 20 0 0 1 -20 -20 z" />
    <path d="M40 12 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#8A6DF0" stroke="none" opacity="0.7" />
  </g>

  <!-- floating geometric shapes along right side -->
  <g opacity="0.28">
    <polygon points="1900,320 1918,352 1882,352" fill="none" stroke="#5D8CFF" stroke-width="1.6" />
    <rect x="1855" y="400" width="22" height="22" rx="5" fill="none" stroke="#8A6DF0" stroke-width="1.6" transform="rotate(18 1866 411)" />
    <circle cx="1905" cy="700" r="14" fill="none" stroke="#4FC9D6" stroke-width="1.6" />
    <polygon points="1930,760 1946,788 1914,788" fill="none" stroke="#7B6BE0" stroke-width="1.4" />
  </g>

  <!-- connecting line motif drifting down the right edge -->
  <path d="M1750 260 C 1820 400, 1700 520, 1780 660 S 1760 900, 1830 980"
        fill="none" stroke="url(#lineFade)" stroke-width="1.8" opacity="0.5" />

  <!-- ============ BOTTOM RIGHT CLUSTER ============ -->

  <!-- futuristic laptop illustration -->
  <g transform="translate(1560,830)" opacity="0.32" stroke="#5D8CFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="0" width="140" height="90" rx="8" />
    <path d="M8 92 l134 0" />
    <path d="M-15 100 h190 l-14 18 h-162 z" />
    <line x1="40" y1="24" x2="120" y2="24" opacity="0.6" />
    <line x1="40" y1="42" x2="100" y2="42" opacity="0.6" />
    <line x1="40" y1="60" x2="112" y2="60" opacity="0.6" />
    <circle cx="80" cy="42" r="16" opacity="0.5" />
  </g>

  <!-- small circuit / node cluster bottom right corner -->
  <g stroke="#6E7BFF" stroke-width="1.5" fill="none" opacity="0.28" stroke-linecap="round">
    <path d="M1900 1000 h-45 v-35 h-30" />
    <circle cx="1900" cy="1000" r="4" fill="#6E7BFF" stroke="none" />
    <circle cx="1825" cy="965" r="4" fill="#6E7BFF" stroke="none" />
    <path d="M1780 1040 h30 v-40" />
    <circle cx="1780" cy="1040" r="3.5" fill="#6E7BFF" stroke="none" />
  </g>

  <!-- floating hexagon / geometric accents -->
  <g opacity="0.24" stroke="#8A6DF0" stroke-width="1.5" fill="none">
    <polygon points="1660,940 1678,950 1678,970 1660,980 1642,970 1642,950" />
    <circle cx="1740" cy="1010" r="10" />
  </g>

  <!-- ============ LEFT / TOP-LEFT FAR CORNER ACCENTS (kept minimal, corners only) ============ -->

  <g opacity="0.18" stroke="#6E7BFF" stroke-width="1.5" fill="none">
    <circle cx="60" cy="60" r="30" />
    <line x1="60" y1="90" x2="60" y2="130" />
    <circle cx="60" cy="140" r="4" fill="#6E7BFF" stroke="none" />
  </g>

  <g opacity="0.16" stroke="#8A6DF0" stroke-width="1.4" fill="none">
    <polygon points="40,980 60,992 60,1016 40,1028 20,1016 20,992" />
  </g>

  <!-- ambient glowing particles scattered near edges only -->
  <g fill="#4FC9D6" opacity="0.4">
    <circle cx="1870" cy="240" r="3" />
    <circle cx="1750" cy="480" r="2.4" />
    <circle cx="1900" cy="600" r="3" />
    <circle cx="1650" cy="900" r="2.6" />
    <circle cx="80" cy="500" r="2.4" />
    <circle cx="40" cy="850" r="3" />
  </g>
</svg>
